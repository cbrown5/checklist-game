<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checklist Games</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(160deg, #0a0a2e 0%, #1a1a4e 60%, #0d0d2b 100%);
      min-height: 100vh;
      padding: 48px 16px 72px;
      color: #fff;
    }

    .page-header {
      text-align: center;
      margin-bottom: 48px;
    }

    .page-title {
      font-size: clamp(2rem, 6vw, 3.5rem);
      font-weight: 900;
      background: linear-gradient(135deg, #6af 0%, #a8f 50%, #ffd000 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.2;
      margin-bottom: 10px;
      text-shadow: none;
    }

    .page-subtitle {
      color: #8af;
      font-size: 1.05rem;
      opacity: 0.8;
      letter-spacing: 0.5px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 24px;
      max-width: 900px;
      margin: 0 auto;
    }

    .card {
      display: block;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(100, 170, 255, 0.3);
      border-radius: 20px;
      padding: 2rem 1.75rem;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 30px rgba(100, 150, 255, 0.1);
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 40px rgba(100, 170, 255, 0.25);
      border-color: rgba(100, 170, 255, 0.7);
    }

    .card-icon {
      font-size: 2.8rem;
      margin-bottom: 14px;
      display: block;
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #e8f4ff;
      margin-bottom: 6px;
    }

    .card-desc {
      font-size: 0.9rem;
      color: #8ab4d4;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <header class="page-header">
    <h1 class="page-title">Checklist Games</h1>
    <p class="page-subtitle">Pick a checklist adventure</p>
  </header>

  <main class="grid">

    <a href="basic-checklist.html" class="card">
      <span class="card-icon">☀️</span>
      <div class="card-title">Morning Checklist</div>
      <div class="card-desc">Simple daily morning routine tracker.</div>
    </a>

    <a href="checklist-rocket.html" class="card">
      <span class="card-icon">🚀</span>
      <div class="card-title">Rocket Launch</div>
      <div class="card-desc">Complete your checklist to launch a rocket into space.</div>
    </a>

    <a href="space-robot.html" class="card">
      <span class="card-icon">🤖</span>
      <div class="card-title">Space Robot Tractor Beam</div>
      <div class="card-desc">Help the robot collect stars with its tractor beam.</div>
    </a>

  </main>

</body>
</html>
